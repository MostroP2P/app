name: mostro
description: "Mostro Mobile v2 — P2P Bitcoin Lightning exchange"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Bridge: Rust core ↔ Flutter UI
  flutter_rust_bridge: 2.11.1
  rust:
    path: rust_builder

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local persistence (Dart UI layer — all platforms)
  sembast: ^3.8.2
  sembast_web: ^2.3.1+1

  # Secure storage (PIN unlock; key crypto stays in Rust)
  flutter_secure_storage: ^9.2.4

  # Preferences (first-run flag, settings)
  shared_preferences: ^2.5.3

  # Onboarding walkthrough
  introduction_screen: ^3.1.14

  # QR code display and scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Cross-platform HTTP client (push server registration)
  http: ^1.2.2

  # System share sheet (invoice sharing)
  share_plus: ^12.0.1

  # Launch external URIs (lightning: wallet handoff)
  url_launcher: ^6.3.1

  # File operations (attachment picker)
  file_picker: ^8.3.7

  # Firebase (push notifications)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Runtime permissions (camera, notifications)
  permission_handler: ^11.4.0

  # File-system paths (DB path on native)
  path: ^1.9.1
  path_provider: ^2.1.5

  # Internationalization
  intl: ^0.20.2

  # Injectable clock so relative-time rendering is deterministic under test
  clock: ^1.1.1

  # UUID generation (collision-resistant notification IDs)
  uuid: ^4.5.1

  # Skeleton loading shimmer effect (DESIGN_SYSTEM.md §9.1)
  shimmer: ^3.0.0

  # Required by flutter_rust_bridge generated code
  freezed_annotation: ^2.4.4

dependency_overrides:
  # permission_handler_html 0.1.4+0 (published 2026-07-31) fails to compile
  # for web (`'isA' isn't defined for the type 'Object'`), breaking every CI
  # web build. Pinned to the previous release until upstream ships a fix:
  # https://github.com/baseflow/flutter-permission-handler/issues/1550
  permission_handler_html: 0.1.3+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Required by flutter_rust_bridge_codegen generate
  freezed: ^2.5.7
  build_runner: ^2.4.13
  # Generates the iOS/Android launcher icons from assets/images/launcher-icon.png
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/fiat.json
    - assets/data/payment_methods.json
    - assets/images/
    - assets/fonts/outfit/OFL.txt
    - assets/fonts/manrope/OFL.txt

  # Brand typography (drawer and order-book handoffs), bundled so the app never
  # fetches fonts at runtime. Outfit is the UI face; Manrope sets the figures
  # (amounts, premiums, sats), whose tabular digits line up across cards. Both
  # are OFL-1.1: the licences ship as assets and are registered with the
  # LicenseRegistry at startup.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/outfit/Outfit-Regular.ttf
        - asset: assets/fonts/outfit/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/outfit/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/outfit/Outfit-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700

# Launcher icons. Mirrors the v1 app's configuration (MostroP2P/mobile) so both
# apps ship the same artwork. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/launcher-icon.png"
  # iOS needs its own, already-opaque source. The shared art is a disc on a
  # transparent square: iOS forbids an alpha channel in app icons, and
  # flattening it here would leave white corners under iOS's rounded mask.
  # `launcher-icon-ios.png` is the same art pre-composited onto the brand
  # background (#1D212C, the previous order-book list well), which also avoids a generator bug —
  # flutter_launcher_icons 0.14.4 turns near-transparent pixels into saturated
  # green, drawing a 1px ring around the disc.
  image_path_ios: "assets/images/launcher-icon-ios.png"
  adaptive_icon_foreground: "assets/images/launcher-icon.png"
  # Same brand background as the iOS source, so the disc merges into the
  # adaptive icon instead of floating on a slightly different grey.
  adaptive_icon_background: "#1D212C"
