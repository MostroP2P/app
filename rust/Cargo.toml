[package]
name = "rust"
version = "2.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

# `frb_expand` is set by flutter_rust_bridge's macros during codegen expansion.
# Declare it so `cargo clippy -- -D warnings` does not flag it as an unknown cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies]
flutter_rust_bridge = "=2.11.1"

# Nostr & Mostro protocol
nostr-sdk = { version = "0.45", default-features = false }
# nostr-sdk 0.45 no longer carries the NIP feature flags: they live on `nostr`
# itself and none are on by default, so the NIPs this crate calls directly are
# enabled here (feature unification applies them to nostr-sdk's copy too).
nostr = { version = "0.45", default-features = false, features = ["std", "nip04", "nip44", "nip47"] }
# 0.14.6 adds `CantDoReason::MaintenanceMode` (and an `Unknown` catch-all) and
# requires nostr 0.45. The Cashu wire form pinned by `mostro/cashu_wire.rs` and
# documented in docs/cashu/README.md §2 was confirmed against 0.14.1 and is
# unchanged since.
mostro-core = "0.14.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
hex = "0.4"

# Logging
log = "0.4"
# Not called directly: declaring it with the `log` feature makes cargo apply
# that feature to the copy nostr-sdk and sqlx use, so their `tracing` events
# become `log` records that api::logging captures. Drop it and every
# dependency's log line disappears silently.
tracing = { version = "0.1", features = ["log"] }

# Base64 encoding (Blossom auth events)
base64 = "0.22"

# File attachment encryption (ChaCha20-Poly1305)
chacha20poly1305 = "0.10"
rand = { version = "0.8", features = ["getrandom"] }

# Hashing (nym derivation)
sha2 = "0.10"

# Wipes key material on drop. The BIP-39 seed is copied out of the identity
# state to seed the Cashu wallet; without this it lingers in freed memory.
# `Zeroizing` is all this needs — no `zeroize_derive`, nothing here derives it.
zeroize = "1"

# secp256k1 scalar math (ECDH shared-key derivation for P2P chat)
k256 = { version = "0.13", features = ["ecdh", "arithmetic"] }

# BIP-32/39 key derivation (m/44'/1237'/38383'/0/N — DO NOT CHANGE)
bip32 = "0.5"
bip39 = { version = "2", features = ["all-languages", "rand"] }

# Native-only: SQLite + tokio do NOT compile to WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Cashu wallet (phase C2 of docs/cashu/README.md). Exact-pinned: cdk is pre-1.0
# and its wallet API moves between minor releases — docs/cashu/cdk-spike.md
# records what was verified against this version and how to upgrade.
# `wallet` only: the mint, signatory, nostr and tor features are server-side or
# unused here, and each drags in a large dependency subtree.
cdk = { version = "=0.17.3", default-features = false, features = ["wallet"] }
# Proof storage. Native by construction (rusqlite), which is why the web build
# gets a typed stub instead — see rust/src/cashu/mod.rs.
cdk-sqlite = { version = "=0.17.3", default-features = false, features = ["wallet"] }

# Android logging backend. api::logging delegates to an `AndroidLogger`
# instance rather than calling `init_once()`, which would install a competing
# global logger and lock the Flutter log stream out.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

# WASM-only: IndexedDB + wasm async executor
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
indexed_db_futures = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# tokio's sync primitives are runtime-agnostic and compile to wasm (no rt/net/fs/time).
tokio = { version = "1", default-features = false, features = ["sync"] }
# tokio::time replacement for wasm (sleep/timeout/Instant backed by the browser).
wasmtimer = "0.4"
# Browser console — the wasm target has no stderr (see api::logging).
web-sys = { version = "0.3", features = ["console"] }
# bip32/k256/chacha20poly1305 still sit on getrandom 0.2, which refuses to
# build for wasm32-unknown-unknown unless its `js` backend is enabled. nostr
# 0.44 used to switch it on for us; nostr 0.45 dropped that dependency.
getrandom = { version = "0.2", features = ["js"] }
# Same for the getrandom 0.4 that nostr's `rand` 0.10 uses: on wasm it has no
# default backend and must be told to use the JS one.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
# nostr 0.45 reads the clock through universal-time, which on
# wasm32-unknown-unknown refuses to *link* until the final crate names a time
# provider (see `rt::browser_clock`). Not caught by `cargo check`.
universal-time = { version = "0.3", default-features = false }
