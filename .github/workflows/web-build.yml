name: Web build

# Builds the web client (Rust core → wasm, then `flutter build web --release`),
# verifies the bundle statically, and smoke-tests it in headless Chrome.
#
# Reusable on purpose (issue #154): ci.yml calls it on every pull request and
# deploy-pages.yml calls it before publishing, so the bundle CI validates and
# the bundle that ships come out of exactly the same steps. A copy-pasted build
# job is a build that passes on PRs and breaks on deploy.

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: >-
          Upload build/web as a GitHub Pages artifact for a deploy job in the
          calling workflow. Off by default — a pull request only needs the
          build and the smoke test to pass.
        type: boolean
        default: false

# The caller grants what it needs; this build runs codegen and third-party
# build scripts and has no business holding a writable token.
permissions: {}

env:
  # Keep in sync with ci.yml.
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.97.0"
  FRB_VERSION: "2.11.1"
  CARGO_EXPAND_VERSION: "1.0.123"
  # The version this pipeline was validated against locally.
  WASM_PACK_VERSION: "0.15.0"
  NODE_VERSION: "22"
  # Must match test/web/smoke/package.json — it keys the browser cache.
  PLAYWRIGHT_VERSION: "1.56.0"

jobs:
  build:
    name: Build and smoke-test web bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The first uncached run compiles std from source (-Z build-std), which is slow.
    timeout-minutes: 60
    env:
      # What a negative control must find in its output to count as "died of
      # the bug the sanitizer fixes", rather than of any of the five unrelated
      # reasons smoke.mjs exits non-zero for. Two messages because Intl.Locale
      # words the empty tag differently from a malformed one — both are the
      # engine refusing a locale before runApp, and matching only the first
      # would report the empty case as an unexplained failure. Kept exact
      # rather than loosened to something like "locale": a lax pattern is what
      # lets a control celebrate an unrelated crash.
      LOCALE_CRASH_SIGNATURE: "Incorrect locale information provided|Intl.Locale constructor can't be empty"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Two toolchains are needed:
      #   • pinned stable — flutter_rust_bridge_codegen shells out to `cargo expand`;
      #   • nightly with rust-src — scripts/build-web.sh compiles the core to wasm
      #     with -Z build-std (it selects nightly itself via RUSTUP_TOOLCHAIN).
      # Nightly is installed first so the pinned stable stays the default toolchain.
      - name: Install Rust nightly (wasm)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install Rust ${{ env.RUST_VERSION }} (codegen)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache build tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/wasm-pack
          key: web-tools-${{ runner.os }}-frb${{ env.FRB_VERSION }}-expand${{ env.CARGO_EXPAND_VERSION }}-wasmpack${{ env.WASM_PACK_VERSION }}

      - name: Install build tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked

      - name: Resolve dependencies
        run: flutter pub get

      # lib/src/rust/ is gitignored and produced on the fly; without it the web
      # build fails to compile. The script also verifies the FRB pins agree.
      - name: Generate Rust bridge bindings
        run: ./scripts/frb-generate.sh

      # Compiles the Rust core to web/pkg/ with shared memory (wasm threads) and
      # fails loudly if the emitted memory is not shared — the failure mode that
      # otherwise only shows up at runtime as a blank page.
      - name: Build Rust core to WASM (shared memory)
        run: ./scripts/build-web.sh --release

      # Project pages are served from a sub-path, so the base href must match the
      # repository name or every asset 404s and the page stays blank.
      #
      # --pwa-strategy=none disables Flutter's (deprecated) service worker: it would
      # register over the same scope as coi-serviceworker.min.js and evict the shim
      # that supplies the COOP/COEP headers, un-isolating the page. Offline caching
      # is the trade-off; cross-origin isolation is not optional here.
      - name: Build Flutter web
        run: |
          flutter build web \
            --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --pwa-strategy=none

      # Guard the two silent-blank-page failure modes: the isolation shim must be
      # in the bundle and referenced by index.html, and Flutter's service worker
      # must not have been emitted alongside it.
      - name: Verify bundle
        run: |
          set -euo pipefail
          test -f build/web/coi-serviceworker.min.js \
            || { echo "::error::coi-serviceworker.min.js missing from the bundle — the deployed page will not be cross-origin isolated."; exit 1; }
          grep -q 'coi-serviceworker.min.js' build/web/index.html \
            || { echo "::error::index.html does not load coi-serviceworker.min.js."; exit 1; }
          # --pwa-strategy=none still emits flutter_service_worker.js (empty) and
          # flutter_bootstrap.js still *embeds* flutter.js, whose minified loader
          # mentions serviceWorkerSettings. The only meaningful signal is the
          # generated call itself: `_flutter.loader.load()` with no settings.
          loader_call="$(grep -o '_flutter\.loader\.load([^;]*)' build/web/flutter_bootstrap.js | tail -n 1)"
          if [ -z "$loader_call" ]; then
            echo "::error::flutter_bootstrap.js does not call _flutter.loader.load — the bundle layout changed; re-check this guard."
            exit 1
          fi
          case "$loader_call" in
            *serviceWorkerSettings*)
              echo "::error::Flutter's service worker is being registered; it competes with the isolation shim for the same scope (expected --pwa-strategy=none)."
              exit 1
              ;;
          esac
          grep -q "base href=\"/${GITHUB_REPOSITORY#*/}/\"" build/web/index.html \
            || { echo "::error::base href was not rewritten to the project sub-path — assets would 404."; exit 1; }
          echo "Bundle looks deployable."

      # Everything above only greps files, and every documented blank-page cause
      # greps clean and dies at runtime — so load the bundle in a real browser.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: test/web/smoke/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install smoke test dependencies
        working-directory: test/web/smoke
        run: |
          npm ci
          # The download is a no-op when the browser cache above hit; the OS
          # packages are not cached and are installed either way.
          npx playwright install --with-deps chromium

      # Runs smoke.mjs against three static fixtures that differ by one thing
      # each, and asserts the exit codes. Proves the gate still fails when it
      # should — a healthy bundle passes whether or not the error checks work,
      # so nothing else here would notice them rotting. Seconds, no build.
      - name: Self-test the smoke test
        working-directory: test/web/smoke
        run: node selftest.mjs

      # Serves the release bundle cross-origin isolated under the production
      # sub-path, then asserts the page is isolated, the Flutter view mounted,
      # a Rust bridge call returned, and nothing errored.
      - name: Smoke test the release bundle (headless Chrome)
        working-directory: test/web/smoke
        env:
          BUNDLE_DIR: ${{ github.workspace }}/build/web
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" node smoke.mjs
      # Built once and reused by every negative control below. Copying the
      # built bundle and cutting the sanitizer out of its HTML — rather than
      # building a second time — is what makes the comparison mean something:
      # both sides come from one build, so the sanitizer is the only difference.
      - name: Build the control bundle — the same build, sanitizer removed (#227)
        run: |
          set -euo pipefail
          control_dir="${RUNNER_TEMP}/web-no-sanitizer"
          rm -rf "$control_dir"
          cp -r "${GITHUB_WORKSPACE}/build/web" "$control_dir"
          # Delete the marker comment through the end of the inline script it
          # introduces. The script contains no literal </script>, so the first
          # one after the marker closes it.
          sed -i '/<!-- locale-sanitizer/,/<\/script>/d' "$control_dir/index.html"
          # Never let a silent no-op turn the controls into a rubber stamp: if
          # the marker is ever renamed, this cuts nothing and every control
          # below would be comparing the bundle against itself.
          if grep -q 'locale-sanitizer' "$control_dir/index.html"; then
            echo "::error::failed to strip the sanitizer — the controls prove nothing"
            exit 1
          fi

      # Regression guard for issue #227: an unparseable browser locale (the
      # POSIX "C" locale, an underscored "en_US", empty) crashed the Flutter
      # web engine's own bootstrap before runApp, with no error path — an
      # unrecoverable blank page. Fixed by the locale sanitizer in
      # web/index.html, which runs before flutter_bootstrap.js and normalizes
      # navigator.language(s). This reruns the same smoke test forcing an
      # invalid locale so the fix can't silently regress.
      #
      # This step covers "C" only, and does so through Playwright's `locale`
      # option — the one path where the tag reaches the page as the browser's
      # own locale rather than as a shadow this repo installed. Kept for that
      # reason. The other broken tags cannot travel this way (Playwright
      # normalizes them first) and are covered by the locale matrix below.
      #
      # The crash itself only exists on Flutter >= 3.38, where the engine's
      # parseBrowserLanguages started building the locale through
      # Intl.Locale (@JS binding) instead of a pure-Dart ui.Locale that
      # validated nothing. If FLUTTER_VERSION ever moves back below that, or
      # the engine stops using Intl, this step passes for the wrong reason —
      # revalidate it against a build without the sanitizer before trusting it.
      - name: Smoke test the release bundle under an invalid locale (#227)
        working-directory: test/web/smoke
        env:
          BUNDLE_DIR: ${{ github.workspace }}/build/web
          SMOKE_LOCALE: "C"
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" node smoke.mjs

      # Negative control for the step above. On its own that step can go green
      # for the wrong reason — if the engine stops crashing on an invalid
      # locale, it passes whether or not the sanitizer is still there or even
      # still works. So run the same bundle with the sanitizer stripped out and
      # require it to FAIL, and to fail with the RangeError this fix exists for
      # — smoke.mjs exits non-zero for five unrelated reasons, plus the ones
      # where Chromium never launches at all, so an exit code alone would let
      # this control report success while proving nothing. Together the two
      # steps assert what actually matters: the bundle survives locale "C", and
      # it survives it *because of this fix*.
      - name: Control — the same bundle without the sanitizer must fail (#227)
        working-directory: test/web/smoke
        env:
          SMOKE_LOCALE: "C"
          # This run is *expected* to die inside engine bootstrap, so the
          # flutter-view selector it waits on will never appear and the wait
          # always runs to the timeout. The crash is synchronous, so 20s is
          # plenty; the default 120s here costs two idle minutes on every PR.
          # Do not "unify" this with the positive steps, which need the
          # generous default to instantiate the wasm core on a cold runner.
          SMOKE_TIMEOUT_MS: "20000"
        run: |
          set -euo pipefail
          control_dir="${RUNNER_TEMP}/web-no-sanitizer"
          control_log="${RUNNER_TEMP}/control-smoke.log"
          if BUNDLE_DIR="$control_dir" BASE_PATH="/${GITHUB_REPOSITORY#*/}/" node smoke.mjs >"$control_log" 2>&1; then
            cat "$control_log"
            echo "::error::the bundle passed under locale C without the sanitizer —"
            echo "::error::the guard above is no longer testing this bug (see #227)"
            exit 1
          fi
          # It failed — but smoke.mjs fails for five reasons that have nothing
          # to do with this bug. Only the locale RangeError proves the control.
          if ! grep -Eq "$LOCALE_CRASH_SIGNATURE" "$control_log"; then
            cat "$control_log"
            echo "::error::the control failed, but not with the locale RangeError —"
            echo "::error::it proves nothing about this fix (see #227)"
            exit 1
          fi
          cat "$control_log"
          # The failing control leaves a screenshot behind; drop it so a later
          # failure does not upload this expected one as its evidence.
          rm -f smoke-failure.png
          echo "control failed as expected — the locale guard is load-bearing"

      # The two steps above only ever exercise "C". Playwright's `locale`
      # option normalizes the tag before the page sees it, so "en_US" arrives
      # as a valid "en-US" and "" falls back to the system locale — a limit of
      # that option, not of the browser. SMOKE_NAVIGATOR_LANGUAGES shadows
      # navigator.language(s) from an init script instead, which runs inside
      # the page before any of its own scripts, so the engine is handed a tag
      # Playwright would never deliver.
      #
      # That closes the gap on #227's second acceptance criterion, which names
      # three tags, and covers the mixed list nothing tested at all: with
      # "C,es-AR" the correct result is not the fallback but "es-AR" — the
      # sanitizer must drop the broken tag and keep the good one.
      #
      # Which is why each case also states the locale it expects to find
      # afterwards. "The view mounted" cannot tell a sanitizer that kept
      # "es-AR" from one that dropped the whole list for the fallback: both
      # boot fine, and only the second silently costs the user their language.
      #
      # Each tag runs twice: against the shipped bundle it must pass, against
      # the control bundle it must fail with the locale signature. The control
      # half costs ~20s per tag (it waits out SMOKE_TIMEOUT_MS for a view that
      # will never mount), which is the price of the guard being self-validating.
      - name: Locale matrix — every tag the sanitizer claims to handle (#227)
        working-directory: test/web/smoke
        run: |
          set -euo pipefail
          control_dir="${RUNNER_TEMP}/web-no-sanitizer"
          base="/${GITHUB_REPOSITORY#*/}/"
          # Deliberately includes the empty string; it is one of the broken
          # tags, and smoke.mjs distinguishes unset from empty for that reason.
          # "<injected tags>|<languages expected after the sanitizer>".
          for case in "C|en-US" "en_US|en-US" "|en-US" "C,es-AR|es-AR"; do
            langs="${case%%|*}"
            expected="${case##*|}"
            label="${langs:-<empty>}"

            echo "::group::locale [$label] — with the sanitizer, must pass and leave [$expected]"
            SMOKE_NAVIGATOR_LANGUAGES="$langs" SMOKE_EXPECT_LANGUAGES="$expected" \
              BUNDLE_DIR="${GITHUB_WORKSPACE}/build/web" \
              BASE_PATH="$base" node smoke.mjs
            echo "::endgroup::"

            echo "::group::locale [$label] — without the sanitizer, must fail"
            log="${RUNNER_TEMP}/control-${label//[^A-Za-z0-9]/_}.log"
            # Scoped to the control, not the step: this run is expected to die
            # in engine bootstrap, so it always waits the selector out, and the
            # default 120s would cost two idle minutes per tag. The positive
            # run above keeps that default — same reason as the single-tag
            # control before it, which must not be unified with it either.
            if SMOKE_TIMEOUT_MS="20000" SMOKE_NAVIGATOR_LANGUAGES="$langs" \
                 BUNDLE_DIR="$control_dir" \
                 BASE_PATH="$base" node smoke.mjs >"$log" 2>&1; then
              cat "$log"
              echo "::error::locale [$label] passed without the sanitizer —"
              echo "::error::the matrix above is no longer testing this bug (see #227)"
              exit 1
            fi
            if ! grep -Eq "$LOCALE_CRASH_SIGNATURE" "$log"; then
              cat "$log"
              echo "::error::locale [$label] failed, but not with a locale error —"
              echo "::error::it proves nothing about this fix (see #227)"
              exit 1
            fi
            cat "$log"
            echo "::endgroup::"

            # Each failing control leaves a screenshot behind; drop it so a
            # later, real failure does not upload an expected one as evidence.
            rm -f smoke-failure.png
            echo "locale [$label]: sanitized to [$expected] with the sanitizer, dies without it"
          done

      - name: Upload smoke test failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-failure
          path: test/web/smoke/smoke-failure.png
          if-no-files-found: ignore

      - name: Upload Pages artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
