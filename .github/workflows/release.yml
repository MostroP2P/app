name: Release

# Pushing a tag `vX.Y.Z` publishes a GitHub release: signed Android APKs (one
# per ABI), Linux / Windows / macOS / iOS builds (release-builds.yml), generated
# release notes, and a PR that records the release in CHANGELOG.md. Maintainer procedure, required secrets and how to recover from
# a failed run: docs/RELEASING.md. test/ci/release_workflow_test.dart guards
# the properties below that are easy to weaken by accident.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Each job widens this only as far as it needs.
permissions:
  contents: read

# Never cancel a release half way: a second push of the same tag queues.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  prepare:
    name: Validate tag / write release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      # Full history and tags: the notes cover everything since the last tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag is the only input, so everything derived from it is checked
      # here, before any runner spends half an hour compiling.
      - name: Validate tag and versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          version="$major.$minor.$patch"

          # Only what was reviewed and merged gets released.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "::error::Tag '$TAG' points at a commit that is not on main."
            exit 1
          fi

          # The About screen shows CARGO_PKG_VERSION and the stores read
          # pubspec.yaml, so the tagged source must already say this version.
          pubspec=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          cargo=$(sed -n 's/^version *= *"\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          # The crate's own lockfile entry, which scripts/bump-version.sh moves too.
          cargo_lock=$(sed -n '/^name = "rust"$/ { n; s/^version = "\(.*\)"/\1/p; }' rust/Cargo.lock)
          if [ "$pubspec" != "$version" ] || [ "$cargo" != "$version" ] || [ "$cargo_lock" != "$version" ]; then
            echo "::error::Tag says $version but pubspec.yaml says '$pubspec', rust/Cargo.toml says '$cargo' and rust/Cargo.lock says '$cargo_lock'. Delete this tag (git push origin :v$version), then run scripts/release.sh $version and follow what it prints: it opens the version PR if main still needs one, and tags main once it carries $version."
            exit 1
          fi

          # Android versionCode, ordered like the versions themselves. Flutter
          # adds 1000 (v7) / 2000 (v8) per ABI on top of it.
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::MINOR and PATCH must stay below 100 (versionCode scheme, docs/RELEASING.md)."
            exit 1
          fi
          build_number=$((major * 10000 + minor * 100 + patch))

          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"

      - name: Collect history since the previous release
        id: history
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 \
            --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' "$TAG^" 2>/dev/null || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Previous release: ${previous:-none (first release)}"

          # Kept with the notes: publish renders the body again from them, once
          # it knows which builds made it.
          mkdir -p release-notes
          git log --first-parent --format='%H%x09%s' ${previous:+"$previous.."}"$TAG" > release-notes/commits.tsv
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 10000 \
            --json number,title,author,mergeCommit,mergedAt > release-notes/prs.json

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The changelog PR is cut from main, so main's copy is the one to extend.
      - name: Generate release notes and changelog
        env:
          TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.history.outputs.previous }}
        run: |
          set -euo pipefail
          printf '%s' "$PREVIOUS_TAG" > release-notes/previous-tag
          git show origin/main:CHANGELOG.md > release-notes/CHANGELOG.md 2>/dev/null \
            || rm -f release-notes/CHANGELOG.md
          dart tool/release_notes.dart \
            --tag "$TAG" \
            --previous-tag "$PREVIOUS_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --commits release-notes/commits.tsv \
            --pull-requests release-notes/prs.json \
            --body-out release-notes/RELEASE_BODY.md \
            --changelog release-notes/CHANGELOG.md
          cat release-notes/RELEASE_BODY.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/
          if-no-files-found: error

  android:
    name: Android (signed APK per ABI)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The only job that sees the signing key. Anyone with write access can push
    # a tag, so give this environment required reviewers (Settings →
    # Environments → release) and the run waits for an admin before it signs
    # anything. Without that setting the environment changes nothing.
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # An APK signed with anything but the release key can never be updated
      # by a later release, so there is no fallback: no key, no release.
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_FILE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (docs/RELEASING.md)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # cargokit builds the Rust core through rustup's `stable` and would add
      # a missing target itself; doing it here keeps that download out of the
      # Gradle build, where a failure is much harder to read.
      - name: Install Rust Android targets
        run: rustup target add armv7-linux-androideabi aarch64-linux-android --toolchain stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # The keystore stays outside the checkout; key.properties has to be inside
      # it (build.gradle.kts), is git-ignored, and both go right after the build.
      - name: Write signing configuration
        env:
          ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_FILE" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > android/key.properties

          # Fail here, in seconds, rather than at :app:packageRelease after
          # fifteen minutes of compiling: the store password must open the
          # keystore and the alias must name a private key in it (a
          # certificate-only entry cannot sign). The password goes in through
          # the environment, not argv, where other processes could read it.
          if ! listing=$(keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD 2>/dev/null); then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore."
            exit 1
          fi
          keys=$(sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' <<< "$listing")
          if ! grep -qix -- "$ANDROID_KEY_ALIAS" <<< "$keys"; then
            echo "::error::ANDROID_KEY_ALIAS names no private key in the keystore. Private keys in it: $(paste -sd ' ' <<< "$keys")"
            exit 1
          fi

      # v7 + v8 only: x86_64 is an emulator ABI nobody installs from a release.
      - name: Build APKs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=GIT_COMMIT="$(git rev-parse HEAD)"

      # The Android App Bundle is what the Play Console takes. One file, all
      # ABIs; Play derives the per-device APKs. Signed with the same key, or
      # Play would see a different app.
      - name: Build app bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          flutter build appbundle --release \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER" \
            --dart-define=GIT_COMMIT="$(git rev-parse HEAD)"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties

      - name: Name and verify APKs
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          for abi in armeabi-v7a arm64-v8a; do
            apk="dist/mostro-$TAG-$abi.apk"
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" "$apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            # build.gradle.kts falls back to the debug key without key.properties.
            if grep -q 'CN=Android Debug' <<< "$certs"; then
              echo "::error::$apk is signed with the debug key."
              exit 1
            fi
          done
          aab="dist/mostro-$TAG.aab"
          mv build/app/outputs/bundle/release/app-release.aab "$aab"
          if jarsigner -verify -verbose:summary -certs "$aab" | grep -q 'CN=Android Debug'; then
            echo "::error::$aab is signed with the debug key."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: asset-android
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error

  # Desktop and iOS. None of these sees a secret, so they run beside the android
  # job, outside its environment.
  builds:
    name: Builds
    needs: prepare
    uses: ./.github/workflows/release-builds.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build_number }}

  # The APKs are the release; a desktop or iOS build that failed must not hold
  # them back. So this runs whenever android succeeded, attaches what was
  # built, and the notes name what is missing. The run still ends red, and
  # re-running its failed jobs adds the missing assets to the same release.
  publish:
    name: Publish GitHub release
    needs: [prepare, android, builds]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Same generator and inputs as prepare; only the Downloads section can
      # differ, by the files that are in dist/. The changelog copy is scratch.
      - name: Write the release description for the assets that were built
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh dist
          dart tool/release_notes.dart \
            --tag "$TAG" \
            --previous-tag "$(cat release-notes/previous-tag)" \
            --repository "$GITHUB_REPOSITORY" \
            --commits release-notes/commits.tsv \
            --pull-requests release-notes/prs.json \
            --assets-dir dist \
            --body-out RELEASE_BODY.md \
            --changelog "$RUNNER_TEMP/changelog-scratch.md"

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Re-running the workflow for a tag updates its release in place.
      - name: Create or update the release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Mostro $TAG" --notes-file RELEASE_BODY.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "Mostro $TAG" --notes-file RELEASE_BODY.md
          fi

  # main is protected, so the changelog arrives as a pull request. A PR opened
  # with GITHUB_TOKEN does not start CI: close and reopen it to run the checks.
  changelog:
    name: Open changelog PR
    needs: [prepare, publish]
    # Explicit, because the default `success()` is false once any job upstream
    # of publish failed — and publish tolerates a failed desktop build.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Commit CHANGELOG.md and open the PR
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/release-notes/CHANGELOG.md" CHANGELOG.md
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md already records $TAG."
            exit 0
          fi

          branch="chore/changelog-$TAG"
          title="chore(release): changelog for $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "$title"
          git push --force origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A PR for $branch is already open; its branch was updated."
            exit 0
          fi
          if ! gh pr create --base main --head "$branch" --title "$title" \
            --body "Records [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG) in \`CHANGELOG.md\`. Generated by the release workflow — close and reopen this PR to start CI."; then
            echo "::error::Could not open the PR. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or open it by hand from branch $branch."
            exit 1
          fi
