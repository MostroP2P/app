name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token: jobs only read source and report their own status.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"
  FRB_VERSION: "2.11.1"
  CARGO_EXPAND_VERSION: "1.0.123"

jobs:
  rust:
    name: Rust (build / test / clippy / wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned (not @stable) so a newer stable clippy can't introduce lints
      # that break `-D warnings` on unrelated PRs. Bump this deliberately.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --locked -- -D warnings

      - name: Check wasm32 target
        run: cargo check --locked --target wasm32-unknown-unknown

  flutter:
    name: Flutter (analyze / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Rust toolchain is required by flutter_rust_bridge_codegen to regenerate
      # the Dart bindings, so the drift check below can compare them with the committed lib/src/rust/.
      # Pinned to match the rust job (see note above). rustfmt is not in the action's minimal
      # profile; without it codegen writes rust/src/frb_generated.rs unformatted and the drift
      # check reports the whole file.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Codegen shells out to `cargo expand` (RUSTFLAGS="--cfg frb_expand"),
      # so cargo-expand must be present alongside the codegen binary.
      - name: Cache codegen tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: frb-tools-${{ runner.os }}-frb${{ env.FRB_VERSION }}-expand${{ env.CARGO_EXPAND_VERSION }}

      - name: Install codegen tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --locked
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked

      - name: Resolve dependencies
        run: flutter pub get

      # Verifies FRB_VERSION above still agrees with pubspec.yaml and rust/Cargo.toml,
      # then generates. Generating with a mismatched codegen produces bindings that
      # fail to compile against the resolved Dart package (see issue #205).
      - name: Generate Rust bridge bindings
        run: ./scripts/frb-generate.sh

      # Regenerate localizations and fail if any locale is missing a key that
      # exists in the English template (app_en.arb). The report is "{}" when
      # everything is translated (see l10n.yaml: untranslated-messages-file).
      - name: Check localizations are fully translated
        run: |
          flutter gen-l10n
          report=lib/l10n/untranslated_messages.txt
          if [ ! -f "$report" ]; then
            echo "::error::Expected untranslated-messages report was not generated."
            exit 1
          fi
          if [ "$(tr -d '[:space:]' < "$report")" != "{}" ]; then
            echo "::error::Untranslated localization keys found (see below):"
            cat "$report"
            exit 1
          fi
          echo "All localization keys are translated across every locale."

      # Generated code is committed (CONTRIBUTING.md → "Generated code"). The two steps
      # above regenerated it from this PR's sources, so any difference means the PR changed
      # rust/src/api/ or an .arb without committing the regenerated output.
      - name: Check generated code is committed
        run: |
          paths=(lib/src/rust rust/src/frb_generated.rs lib/l10n)
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "::error::Generated code is out of date. Run ./scripts/frb-generate.sh and flutter gen-l10n, then commit the result."
            git status --short -- "${paths[@]}"
            git diff --stat -- "${paths[@]}"
            exit 1
          fi
          echo "Generated code matches the committed copy."

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Web is a first-class target (constitution, specs/004/plan.md), and its
  # failure mode is a blank page that every static check passes. Building and
  # smoke-testing it here means a PR that breaks the web target fails before it
  # lands, instead of after deploy-pages.yml has already run on main (#154).
  #
  # Same reusable definition the deploy uses, so the two cannot drift apart.
  web:
    name: Web (wasm build / smoke test)
    uses: ./.github/workflows/web-build.yml
    permissions:
      contents: read

  # Nothing else compiles the iOS target. The Swift in ios/Runner/, the
  # CocoaPods graph (Firebase, workmanager, the cargokit pod that builds the
  # Rust core for aarch64-apple-ios) and project.pbxproj edits all pass analyze
  # and test on Linux and only fail on a Mac — as a deployment target below a
  # pod's minimum does, at `pod install`. A device build without signing
  # catches them: CI holds no Apple certificate, so entitlements
  # (aps-environment, the keychain group) are still only checked by a signed
  # build on a device. The repository is public, so macOS minutes are not
  # billed. test/ci/ios_build_workflow_test.dart keeps this job in place.
  #
  # macos-26, not macos-15: workmanager_apple compiles code that uses the iOS
  # 26 SDK (BGContinuedProcessingTask), and each macOS image ships a single
  # Xcode major — macos-15 has no iOS 26 SDK and fails in Swift compilation.
  # Building on a Mac locally needs Xcode 26 for the same reason.
  ios:
    name: iOS (build, no codesign)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # cargokit builds the Rust core through rustup with its default `stable`
      # toolchain (the repo has no cargokit.yaml) and adds a missing target
      # itself. Adding it here keeps that download out of the Xcode build phase,
      # where a failure is much harder to read.
      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios --toolchain stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'ios/Podfile') }}

      # Debug compiles everything that can break here (Swift, pods, the Rust
      # staticlib, the pbxproj) and skips the Dart AOT step of a release build.
      - name: Build iOS app
        run: flutter build ios --debug --no-codesign
